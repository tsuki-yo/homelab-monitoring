global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.gmail.com:587
  smtp_from: your-email@gmail.com  # Replace with your Gmail address
  smtp_auth_username: your-email@gmail.com  # Replace with your Gmail address
  smtp_auth_password: "your-gmail-app-password"  # Replace with your Gmail App Password (not your regular password!)
  smtp_require_tls: true

route:
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email
  routes:
    - match:
        severity: critical
      receiver: email-critical
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: your-email@gmail.com  # Replace with your email
        send_resolved: true
        headers:
          subject: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"

  - name: email-critical
    email_configs:
      - to: your-email@gmail.com  # Replace with your email
        send_resolved: true
        headers:
          subject: "[CRITICAL] {{ .GroupLabels.alertname }}"

# Prevent warning alerts when critical alerts are firing
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
